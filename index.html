<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mark's Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">

  <!-- Soft gate UI -->
  <div id="gate" class="gate">
    <h2>Sign in</h2>
    <p>Enter password to view your notes.</p>
    <input id="pw" type="password" placeholder="Password">
    <button id="enter" class="btn">Unlock</button>
    <p id="msg" class="error"></p>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <div class="app-wrap">
      <div class="sidebar">
        <h2>Subjects</h2>
        <ul id="subject-list">
          <li><a href="#" data-subject="ALL" class="active">All Files</a></li>
          <li><a href="#" data-subject="Specialist Mathematics">Specialist Mathematics</a></li>
          <li><a href="#" data-subject="Mathematical Method">Mathematical Method</a></li>
        </ul>
        <div class="toggle-wrap">
          <button id="toggle-dark" class="btn">🌙 Toggle Dark Mode</button>
        </div>
      </div>

      <div class="content">
        <h1>Welcome to Mark's Notes</h1>
        <p id="intro">Use the sidebar to switch subjects, search below to filter files.</p>
        <h2 id="course-title"></h2>
        <input type="text" id="search" placeholder="Search files... (filters filenames)">
        <div id="pdfs" class="group"></div>
      </div>
    </div>
  </div>

  <script>
    const PJSON_URL = "files.json";
    const SUBJECTS = ["Specialist Mathematics", "Mathematical Method"];
    const SUBJECT_TITLES = {
      "Specialist Mathematics": "Specialist Mathematics",
      "Mathematical Method": "Mathematical Method",
    };

    function getFileIcon(ext) {
      ext = (ext || "").toLowerCase();
      if (ext === "pdf") return "icons/Treetog-I-PDF.256.png";
      if (["doc","docx"].includes(ext)) return "icons/Word.png";
      if (["ppt","pptx"].includes(ext)) return "icons/ppt.png";
      if (["txt"].includes(ext)) return "icons/Txt.png";
      // if (["png"].includes(ext)) return "icons/png.png"
      return "";
    }

    let data = {};
    let currentSubject = "ALL";
    let query = "";

    const pdfContainer = document.getElementById("pdfs");
    const searchInput = document.getElementById("search");
    const subjectList = document.getElementById("subject-list");
    const toggleBtn = document.getElementById("toggle-dark");
    const courseTitleEl = document.getElementById("course-title");

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.body.classList.replace("light", "dark");
    }

    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    });

    subjectList.addEventListener("click", (e) => {
      const link = e.target.closest("a[data-subject]");
      if (!link) return;
      e.preventDefault();
      currentSubject = link.dataset.subject;
      searchInput.value = "";
      query = "";
      subjectList.querySelectorAll("a").forEach(a => a.classList.remove("active"));
      link.classList.add("active");
      render();
    });

    searchInput.addEventListener("input", () => {
      query = searchInput.value.trim().toLowerCase();
      render();
    });

    fetch(PJSON_URL)
      .then(r => r.json())
      .then(json => { data = json; render(); })
      .catch(() => {
        pdfContainer.innerHTML = `<p class="empty">Couldn’t load <code>${PJSON_URL}</code>. Make sure it’s in the repo root.</p>`;
      });

    /* Soft Gate */
    const PASSWORD_SHA256_HEX =
      "781c405a42422446843714092b33c1e7d578ff8bcc9cd7c3c44b7ffdbc23dd46";
    const $ = s => document.querySelector(s);
    const enc = s => new TextEncoder().encode(s);
    const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");

    async function verify(pw) {
      const d = await crypto.subtle.digest("SHA-256", enc(pw));
      return hex(d) === PASSWORD_SHA256_HEX;
    }
    async function tryUnlock() {
      $("#msg").textContent = "";
      const ok = await verify($("#pw").value);
      if (ok) {
        $("#app").hidden = false;
        $("#gate").style.display = "none";
        sessionStorage.setItem("unlocked","1");
      } else {
        $("#msg").textContent = "Incorrect password.";
      }
    }

    if (sessionStorage.getItem("unlocked") === "1") {
      $("#app").hidden = false;
      $("#gate").style.display = "none";
    } else {
      $("#gate").style.display = "block";
      $("#enter").addEventListener("click", tryUnlock);
      $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
    }
  </script>
</body>
</html>
